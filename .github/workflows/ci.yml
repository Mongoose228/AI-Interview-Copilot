name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libasound2-dev libpulse-dev libegl1 libxcb-cursor0 libxkbcommon-x11-0 libgl1
        
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint with ruff
      run: |
        ruff check .
        
    - name: Test with pytest
      env:
        QT_QPA_PLATFORM: offscreen
        QT_DEBUG_PLUGINS: 1
      run: |
        pytest tests/ -v
